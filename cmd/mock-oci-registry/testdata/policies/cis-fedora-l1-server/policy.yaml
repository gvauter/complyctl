title: Linux VM Compliance Policy - CIS Fedora Server L1 and FINOS CCC
metadata:
  id: linux-vm-compliance-policy
  type: Policy
  gemara-version: "0.1.0"
  version: "1.0.0"
  description: >-
    Organization policy for assessing Linux virtual machines against a unified set of
    security controls derived from the CIS Fedora Server Level 1 Benchmark and the
    FINOS Common Cloud Controls framework. This policy defines assessment plans that
    leverage OpenSCAP via the complyctl toolchain to evaluate audit logging, access
    control, and cryptographic policy compliance.
  author:
    id: complytime-demos
    name: ComplyTime Demos
    type: Human
  mapping-references:
    - id: linux-vm-security-catalog
      title: Linux VM Security Controls Catalog
      version: "1.0.0"
      description: Gemara Layer 2 control catalog for Linux VM security
contacts:
  responsible:
    - name: Platform Engineering Team
  accountable:
    - name: Chief Information Security Officer
scope:
  in:
    technologies:
      - Linux Virtual Machines
      - Fedora
imports:
  catalogs:
    - reference-id: linux-vm-security-catalog
adherence:
  evaluation-methods:
    - type: Automated
      description: OpenSCAP automated compliance evaluation
      executor:
        id: openscap
        name: OpenSCAP
        type: Software
  assessment-plans:
    # --- AUDIT: LVMS-AUDIT-01 ---
    - id: package_audit_installed
      requirement-id: package_audit_installed
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: service_auditd_enabled
      requirement-id: service_auditd_enabled
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: grub2_audit_argument
      requirement-id: grub2_audit_argument
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: grub2_audit_backlog_limit_argument
      requirement-id: grub2_audit_backlog_limit_argument
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: audit_rules_login_events
      requirement-id: audit_rules_login_events
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: audit_rules_login_events_faillock
      requirement-id: audit_rules_login_events_faillock
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: audit_rules_login_events_lastlog
      requirement-id: audit_rules_login_events_lastlog
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    - id: audit_rules_session_events
      requirement-id: audit_rules_session_events
      frequency: on-demand
      evaluation-methods:
        - type: Automated
          executor:
            id: openscap
            name: OpenSCAP
            type: Software
    # --- ACCESS: LVMS-ACCESS-01 ---
    - id: sshd_disable_root_login
      requirement-id: sshd_disable_root_login
      frequency: on-demand
      evaluation-methods:
        - type: Automated
